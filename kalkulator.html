<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Nilai</title>
</head>
<body>

    <header>
        <h2>Andi Pratama</h2>
        <nav>
            <a href="#">Beranda</a>
            <a href="#">Proyek</a>
            <a href="#">Kontak</a>
        </nav>
    </header>

    <main>
        <h2>Kalkulator Nilai</h2>

        <p>Masukkan nilai tugas, UTS, dan UAS, lalu tekan tombol Hitung.</p>

        <label>Nilai Tugas</label><br>
        <input type="number" id="tugas"><br><br>

        <label>Nilai UTS</label><br>
        <input type="number" id="uts"><br><br>

        <label>Nilai UAS</label><br>
        <input type="number" id="uas"><br><br>

        <button onclick="hitungNilai()">Hitung</button>

        <p id="hasil"></p>
    </main>

    <footer>
        <p>Kontak: andi.pratama@example.com | GitHub | YouTube</p>
        <p>© 2026 Andi Pratama. Dibuat dengan semangat belajar.</p>
    </footer>

    <script>
        function hitungNilai() {
            let tugas = Number(document.getElementById("tugas").value);
            let uts = Number(document.getElementById("uts").value);
            let uas = Number(document.getElementById("uas").value);

            let rata = (tugas + uts + uas) / 3;
            let predikat;

            if (rata >= 85) {
                predikat = "A";
            } else if (rata >= 75) {
                predikat = "B";
            } else if (rata >= 65) {
                predikat = "C";
            } else {
                predikat = "D";
            }

            document.getElementById("hasil").innerHTML =
                "Rata-rata " + rata.toFixed(1) +
                ", predikat " + predikat;
        }
    </script>

</body>
</html>
